<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Entry – Spendly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&display=swap&font-display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>body { padding: 0; }</style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spendly">
    <link rel="apple-touch-icon" href="/static/icon.svg">
</head>
<body class="auth-layout">

<div class="auth-card glass-card fade-in">
    <h2 class="mb-1 text-center"><i class="fas fa-edit" style="color: var(--primary);"></i> Edit Entry</h2>
    <p class="mb-2 text-center" style="color: var(--text-tertiary); font-size: 0.85rem;">Modify your transaction details.</p>

    <form method="POST">
        <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" step="0.01" name="amount" value="{{ exp['amount'] }}" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <div class="category-grid" id="category-grid"></div>
            <input type="hidden" name="category" id="selected-category" value="{{ exp['category'] }}">
        </div>

        <div class="form-group">
            <label>Note</label>
            <input type="text" name="note" value="{{ exp['note'] if exp['note'] else '' }}">
        </div>

        <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
            <a href="/dashboard" class="btn btn-ghost" style="flex: 1;">CANCEL</a>
            <button type="submit" class="btn btn-primary" style="flex: 2;">SAVE CHANGES</button>
        </div>
    </form>
</div>

<script>
const CATEGORIES = [
    { name: 'Food',          emoji: '🍔' },
    { name: 'Transport',     emoji: '🚗' },
    { name: 'Shopping',      emoji: '🛍️' },
    { name: 'Bills',         emoji: '⚡' },
    { name: 'Entertainment', emoji: '🎬' },
    { name: 'Health',        emoji: '💊' },
    { name: 'Education',     emoji: '📚' },
    { name: 'Groceries',     emoji: '🛒' },
    { name: 'Fitness',       emoji: '🏋️' },
    { name: 'Travel',        emoji: '✈️' },
    { name: 'Rent',          emoji: '🏠' },
    { name: 'Subscriptions', emoji: '📱' },
    { name: 'Dining Out',    emoji: '🍽️' },
    { name: 'Beauty',        emoji: '💄' },
    { name: 'Pets',          emoji: '🐾' },
    { name: 'Gifts',         emoji: '🎁' },
    { name: 'Investment',    emoji: '📊' },
    { name: 'Others',        emoji: '📦' },
];

let selectedCat = "{{ exp['category'] }}";

function renderCategories() {
    const grid = document.getElementById('category-grid');
    grid.innerHTML = '';
    CATEGORIES.forEach(cat => {
        const chip = document.createElement('div');
        chip.className = 'cat-chip' + (cat.name === selectedCat ? ' selected' : '');
        chip.innerHTML = `<span>${cat.emoji}</span><span style="font-size:10px">${cat.name}</span>`;
        chip.onclick = () => {
            selectedCat = cat.name;
            document.getElementById('selected-category').value = cat.name;
            renderCategories();
        };
        grid.appendChild(chip);
    });
}

document.addEventListener('DOMContentLoaded', renderCategories);
</script>

<script src="/static/pwa.js"></script>
</body>

</html>
